_base_:
- ../dataset/solar.yml
_custom_imports_:
- SeqSNN.network
- SeqSNN.dataset
- SeqSNN.runner

data:
  raw_label: False
  window: 168
  horizon: 48
  normalize: 1

runner:
  type: ts
  task: regression
  optimizer: Adam
  lr: 0.001
  weight_decay: 0.0
  loss_fn: mse
  metrics: [r2, rse]
  observe: loss
  lower_is_better: True
  max_epoches: 1000
  early_stop: 30
  batch_size: 16
  aggregate: True

network:
  type: SpikformerCoMRT
  dim: 256
  d_ff: 1024
  depths: 2
  num_steps: 4
  heads: 8
  max_length: 168
  pe_mode: concat
  strides: [1, 3, 14, 28, 56]
  bits: [3, 5, 2, 2, 3]
  # diagnostic_score: 0.7878  (target: ?)

runtime:
  seed: 101
  output_dir: outputs/Solar48ClipMRT/SpikformerCoMRT/solar/score0p8_seed101
